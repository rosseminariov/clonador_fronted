<div class="max-w-6xl mx-auto">
  <div class="bg-white dark:bg-zinc-900 rounded-2xl shadow ring-1 ring-black/5 dark:ring-white/10 p-5">
    <div class="flex items-center gap-2 mb-4">
      <span class="material-icons text-brand-600">mic</span>
      <h2 class="text-xl font-semibold text-zinc-900 dark:text-zinc-50">
        Clonador de Voz (Frontend Clean Architecture)
      </h2>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <!-- Izquierda: archivo + waveform -->
      <div>
        <button mat-stroked-button color="primary" (click)="fileInput.click()">
          <span class="material-icons">upload_file</span>&nbsp;Seleccionar archivo
        </button>
        <input #fileInput type="file" (change)="onFileChange($event)" accept="audio/*" hidden />

        <div id="wave" class="mt-3 rounded-lg border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 h-[110px]"></div>

        <!-- Barra de progreso al subir -->
        <mat-progress-bar *ngIf="uploading" mode="indeterminate" class="mt-3"></mat-progress-bar>
      </div>

      <!-- Derecha: texto + voz + acciones -->
      <div>
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Texto a sintetizar</mat-label>
          <textarea matInput [(ngModel)]="text" rows="5" placeholder="Escribe el texto..."></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Selecciona voz</mat-label>
          <mat-select [(ngModel)]="selected">
            <mat-option *ngFor="let v of voices" [value]="v.id">{{ v.name }} ({{ v.lang }})</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="flex gap-3 mt-2">
          <button mat-raised-button color="primary" (click)="saveAudio()" [disabled]="!blob || uploading">
            <span class="material-icons">save</span>&nbsp;Guardar audio
          </button>
          <button mat-raised-button color="accent" (click)="cloneNow()" [disabled]="(!blob && !audioId) || cloning">
            <span class="material-icons">auto_fix_high</span>&nbsp;Clonar voz
          </button>
        </div>

        <div class="mt-4" id="output"></div>
      </div>
    </div>

    <div class="flex items-center gap-2 text-xs text-zinc-500 dark:text-zinc-400 mt-4">
      <span class="material-icons !text-base">info</span>
      <span>Formatos soportados por el navegador: webm/ogg/wav/mp3</span>
    </div>
  </div>
</div>
