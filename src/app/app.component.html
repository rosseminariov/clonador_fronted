<header class="border-b bg-white dark:bg-zinc-900 dark:border-zinc-800">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="material-icons text-brand-600">graphic_eq</span>
      <h3 class="m-0 text-zinc-900 dark:text-zinc-50">{{ title }}</h3>
    </div>
    <mat-slide-toggle (change)="toggleDark($event.checked)">🌙 Dark</mat-slide-toggle>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <router-outlet></router-outlet>
</main>
