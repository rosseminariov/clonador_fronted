<!-- ========== SPLASH / LOADING SCREEN ========== -->
<div
  *ngIf="showSplash"
  class="fixed inset-0 z-[9999] flex items-center justify-center overflow-hidden
         bg-white dark:bg-black"
>
  <!-- Fondos con blobs -->
  <div class="absolute inset-0">
    <div class="absolute -left-1/3 -top-1/3 w-[70vw] h-[70vw] rounded-full blur-3xl opacity-30
                bg-[radial-gradient(circle_at_center,_#34d399_0%,_transparent_60%)]">
    </div>

    <div class="absolute -right-1/3 -bottom-1/3 w-[70vw] h-[70vw] rounded-full blur-3xl opacity-30
                bg-[radial-gradient(circle_at_center,_#60a5fa_0%,_transparent_60%)]">
    </div>

    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 
                w-[60vw] h-[60vw] rounded-full blur-3xl opacity-25
                bg-[radial-gradient(circle_at_center,_#f472b6_0%,_transparent_60%)]">
    </div>
  </div>

  <!-- TEXTO / MARCA -->
  <div class="relative text-center">
    <div class="text-4xl md:text-6xl font-extrabold tracking-tight text-zinc-900 dark:text-zinc-50">
      VoxiClone AI
    </div>

    <div class="mt-3 text-sm md:text-base text-zinc-500 dark:text-zinc-400">
      Cargando …
    </div>

    <!-- BARRA DE PROGRESO -->
    <div class="mt-6 h-1 w-40 mx-auto rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden">
      <div class="h-full w-1/3 rounded-full bg-zinc-900 dark:bg-zinc-50 animate-splash-bar"></div>
    </div>
  </div>
</div>

<!-- ========== CONTENIDO REAL DE LA APP ========== -->

<header class="p-4 border-b border-zinc-200 dark:border-zinc-800">
  <h3 class="m-0">{{ title }}</h3>
</header>

<main class="p-4">
  <!-- Mostramos directamente tu página principal -->
  <app-voice-page></app-voice-page>
</main>
